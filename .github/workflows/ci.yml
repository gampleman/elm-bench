name: CI

on: [push, pull_request]

jobs:
  elm:
    name: Elm package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache ~/.elm
        uses: actions/cache@v4
        with:
          path: ~/.elm
          key: elm-${{ hashFiles('elm.json', 'review/elm.json') }}

      - name: Install Elm tools
        run: npm install -g elm elm-format elm-review elm-test-rs

      - name: Compile package
        run: elm make --docs=docs.json

      - name: Check formatting
        run: elm-format src/ --validate

      - name: Run elm-review
        run: elm-review

  cli:
    name: CLI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: cli/node_modules
          key: cli-node-modules-${{ hashFiles('cli/package-lock.json') }}

      - name: Cache ~/.elm
        uses: actions/cache@v4
        with:
          path: ~/.elm
          key: elm-cli-${{ hashFiles('cli/elm/elm.json', 'elm.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test
        timeout-minutes: 5

  publish-elm:
    name: Publish Elm package
    if: github.ref == 'refs/heads/main'
    needs: [elm, cli]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache ~/.elm
        uses: actions/cache@v4
        with:
          path: ~/.elm
          key: elm-${{ hashFiles('elm.json') }}

      - name: Install Elm
        run: npm install -g elm

      - name: Elm Publish
        uses: dillonkearns/elm-publish-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    name: Publish npm package
    if: github.ref == 'refs/heads/main'
    needs: [elm, cli]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Check if publish needed
        id: check
        working-directory: cli
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          PUBLISHED=$(npm view elm-bench version 2>/dev/null || echo "0.0.0")
          if [ "$CURRENT" != "$PUBLISHED" ]; then
            echo "publish=true" >> $GITHUB_OUTPUT
          else
            echo "publish=false" >> $GITHUB_OUTPUT
          fi

      - name: Install and build
        if: steps.check.outputs.publish == 'true'
        working-directory: cli
        run: |
          npm ci
          npm run build

      - name: Publish with provenance
        if: steps.check.outputs.publish == 'true'
        working-directory: cli
        run: npm publish --provenance --access public
